name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The push trigger only matches the glob `v*` — it does not check that
      # what follows is valid semver. Everything downstream (gh release
      # create, six cross-compiled uploads, then npm publish) is expensive
      # and hard to fully undo, so a malformed tag (v1, v1.2, vfoo) must
      # fail here, before any of that runs, not late inside npm publish.
      - name: validate tag is semver (vMAJOR.MINOR.PATCH[-pre][+build])
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $PATTERN ]]; then
            echo "::error::tag '$TAG' is not valid semver — expected vMAJOR.MINOR.PATCH (e.g. v1.2.3), optionally with -prerelease or +build metadata"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - working-directory: npm/wrapper
        run: node --test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # CGO_ENABLED=0 means all six targets cross-compile from this one
      # ubuntu runner — no per-OS matrix, no C toolchains. `make release-build`
      # is the same target a maintainer runs locally for a bootstrap publish
      # (see Makefile) — one implementation, not two that can drift apart.
      - name: build all six targets
        run: make release-build VERSION="${GITHUB_REF_NAME#v}"

      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber

  # Gated behind a repo variable rather than always running: a trusted
  # publisher can't be configured on npmjs.com for a package that doesn't
  # exist yet, so without this gate every fork's first tag push would red-X.
  # Set the `NPM_PUBLISH` repo/environment variable to `true` once all
  # seven @driftmapper/cli* packages have trusted publishers configured on
  # npmjs.com for this repo+workflow.
  publish-npm:
    needs: build
    if: vars.NPM_PUBLISH == 'true'
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm's OIDC trusted-publisher exchange
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # npm 11.x — required for trusted-publisher OIDC
          registry-url: "https://registry.npmjs.org"

      - name: download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" --dir dist --pattern 'driftmapper-*'

      # publish-platforms/wait-platforms/publish-wrapper are the same
      # Makefile targets a maintainer runs locally for a bootstrap publish —
      # one implementation of the publish sequence, not two that can drift
      # apart. See the targets' own comments in Makefile for the ordering
      # and idempotency reasoning (mirrored in CLAUDE.md).
      - name: publish platform packages
        run: make publish-platforms VERSION="${GITHUB_REF_NAME#v}"

      - name: wait for platform packages to become visible
        run: make wait-platforms VERSION="${GITHUB_REF_NAME#v}"

      - name: stamp and publish the wrapper
        run: make publish-wrapper VERSION="${GITHUB_REF_NAME#v}"
