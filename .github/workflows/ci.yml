name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: make test

      - name: cross-compile all six targets (and check reproducibility)
        run: make cross

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pack-and-install e2e builds a real Go binary, so this job needs
      # both toolchains.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: make npm-check
